<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth, 
  GoogleAuthProvider, 
  signInWithPopup, 
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, 
  doc, 
  onSnapshot, 
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCP2_AgtMkaUBi9H2L85U8kagzUGSoDAFg",
  authDomain: "viola-kalendar.firebaseapp.com",
  projectId: "viola-kalendar",
  storageBucket: "viola-kalendar.firebasestorage.app",
  messagingSenderId: "313947429240",
  appId: "1:313947429240:web:0e65fc88f192f5f9f3d08d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

await setPersistence(auth, browserLocalPersistence).catch(console.error);

function notifyAuth(user) {
  window.__sichtovniceFirebase._user = user;
  if (window.__authListeners && window.__authListeners.length) {
    window.__authListeners.forEach(cb => {
      try { cb(user); } catch(e) { console.error(e); }
    });
  }
}

onAuthStateChanged(auth, (user) => {
  notifyAuth(user);
});

window.__realSubscribe = (onData, onStatus) => {
  try {
    const docRef = doc(db, "sichtovnice", "main");
    const unsub = onSnapshot(docRef, (snap) => {
      if (snap.exists()) {
        const data = snap.data();
        onData(data);
      } else {
        onData(null);
      }
      if (onStatus) onStatus("cloud");
    }, (err) => {
      console.error("Firestore onSnapshot error:", err);
      if (onStatus) onStatus("error");
    });
    return unsub;
  } catch (err) {
    console.error("Firestore subscribe setup error:", err);
    if (onStatus) onStatus("error");
    return () => {};
  }
};

window.__realSave = async (state) => {
  try {
    const docRefMain = doc(db, "sichtovnice", "main");
    const docRef2 = doc(db, "sichtovnice", "v2");
    await Promise.all([
      setDoc(docRefMain, state),
      setDoc(docRef2, state)
    ]);
    console.log("Firestore saved successfully");
    return true;
  } catch (err) {
    console.error("Firestore save error:", err);
    throw err;
  }
};

if (window.__pendingSubscribe) {
  window.__realSubscribe(window.__pendingSubscribe.onData, window.__pendingSubscribe.onStatus);
}

window.__sichtovniceLogin = async () => {
  const btn = [...document.querySelectorAll("button")].find(x => /PŘIHLÁSIT GOOGLE|OTEVÍRÁM/i.test(x.textContent));
  if (btn) {
    btn.disabled = true;
    btn.textContent = "OTEVÍRÁM GOOGLE…";
  }

  try {
    const result = await signInWithPopup(auth, provider);
    notifyAuth(result.user);
  } catch (err) {
    if (btn) {
      btn.disabled = false;
      btn.textContent = "PŘIHLÁSIT GOOGLE";
    }
  }
};
</script>

@import url("https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Courier+Prime:wght@400;700&family=Oswald:wght@500;600;700&display=swap");

:root {
  --paper: #ece4d6;
  --sheet: #fffcf5;
  --ink: #26221d;
  --muted: #6e6657;
  --rule: #bdb09f;
  --rule-soft: #c8bcac;
  --shift: #f8e7d4;
  --shift-line: #d2a47c;
  --stamp: #1c5a3d;
  --stamp-soft: #d9e8de;
  --weekend: #e5e4ec;
  --weekend-ink: #3b3a50;
  --holiday: #f2dce3;
  --holiday-ink: #6b243e;
  --today: #cf9522;
  --today-bg: #fdf0d2;
  --accent: #6d4a2f;
}

body {
  background: var(--paper) !important;
  color: var(--ink) !important;
  font-family: "Archivo Narrow", system-ui, sans-serif !important;
  -webkit-font-smoothing: antialiased;
}

.sheet {
  background: var(--sheet);
  border: 2px solid #bdb09f;
  box-shadow: 0 1px 0 #fff inset, 0 18px 40px -28px rgb(38 34 29 / 0.45);
}

.cell-btn {
  transition: background-color 140ms cubic-bezier(0.25, 1, 0.5, 1),
    border-color 140ms cubic-bezier(0.25, 1, 0.5, 1),
    color 140ms cubic-bezier(0.25, 1, 0.5, 1);
}

input[type="time"] {
  font-family: "Courier Prime", ui-monospace, monospace;
}

.shift-cell {
  container-type: inline-size;
}

.led-panel {
  border-radius: 8px;
  background: #ffffff;
  border: 1px solid #d9cfc0;
  box-shadow: inset 0 -14px 20px -18px rgb(38 34 29 / 0.35);
}

.led-digits {
  font-family: "Oswald", "Archivo Narrow", system-ui, sans-serif;
  font-weight: 600;
  color: #1a1815;
  letter-spacing: -0.01em;
  line-height: 0.95;
  font-variant-numeric: tabular-nums;
}

.led-colon {
  color: #9a9184;
  padding-inline: 1px;
}

.led-rule {
  display: block;
  height: 1px;
  margin: 5px 0;
  background: linear-gradient(to right, rgb(38 34 29 / 0.14), rgb(38 34 29 / 0.06) 78%, transparent);
}

.led-edit { cursor: pointer; }
.led-edit:hover { background: rgb(38 34 29 / 0.07); }

.led-step {
  display: grid;
  place-items: center;
  width: 18px;
  height: 14px;
  border-radius: 3px;
  font-size: 7px;
  line-height: 1;
  color: #867d70;
  background: rgb(38 34 29 / 0.06);
}

.perforation {
  background-image: radial-gradient(circle at center, #cbbfab 0 1.9px, transparent 2.2px);
  background-size: 8px 12px;
  background-repeat: repeat-y;
  background-position: center top;
}

.state-icons {
  display: flex !important;
  justify-content: center !important;
  align-items: center !important;
  gap: 8px !important;
  margin: 0 auto !important;
}

.state-icon {
  flex-shrink: 0 !important;
}

.total-sum {
  font-family: "Oswald", system-ui, sans-serif;
  font-size: 22px;
  font-weight: 700;
}

.total-num {
  font-family: "Oswald", system-ui, sans-serif;
  font-size: 20px;
  font-weight: 700;
}

.total-unit {
  font-size: 12px;
  font-weight: 600;
}

.weekend-row {
  background: var(--weekend) !important;
}
.weekend-row > div { background: var(--weekend) !important; }

.holiday-row {
  background: var(--holiday) !important;
}
.holiday-row > div { background: var(--holiday) !important; }

/* PC: overflow visible pro sticky header */
@media (min-width: 769px) {
  html, body, #root, .sheet {
    overflow: visible !important;
  }
  .sheet-viewport {
    overflow: visible !important;
    position: static !important;
  }
  .sticky-people-header {
    position: -webkit-sticky !important;
    position: sticky !important;
    top: 0 !important;
    z-index: 100 !important;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15) !important;
  }
}

/* Mobil: 2D scroll container */
@media (max-width: 768px) {
  body { padding: 0 !important; margin: 0 !important; }
  main { padding: 4px 0 60px 0 !important; }
  header { padding: 0 10px !important; margin-bottom: 8px !important; }
  header h1 { font-size: 24px !important; }
  header p { font-size: 11px !important; margin-top: 1px !important; }

  .sheet {
    border-radius: 0 !important;
    border-left: none !important;
    border-right: none !important;
  }

  .sheet-viewport {
    max-height: calc(100dvh - 85px) !important;
    overflow: auto !important;
    position: relative !important;
    -webkit-overflow-scrolling: touch !important;
  }

  .sticky-people-header {
    position: -webkit-sticky !important;
    position: sticky !important;
    top: 0px !important;
    z-index: 100 !important;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3) !important;
    background: var(--ink) !important;
  }
  .sticky-people-header .date-col {
    height: 46px !important;
    z-index: 120 !important;
  }
  .sticky-people-header > div {
    height: 46px !important;
    padding: 0 2px !important;
  }
  .name-head {
    font-size: 15px !important;
    letter-spacing: 0.02em !important;
  }

  .date-col, .day-date {
    position: -webkit-sticky !important;
    position: sticky !important;
    left: 0px !important;
    z-index: 50 !important;
    min-width: 76px !important;
    width: 76px !important;
    box-sizing: border-box !important;
    padding: 4px 1px !important;
  }
}
