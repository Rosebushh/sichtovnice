window.__authListeners = [];
window.__sichtovniceFirebase = {
  _user: null,
  onAuth: function(cb) {
    window.__authListeners.push(cb);
    if (this._user) cb(this._user);
  },
  signIn: function() {

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getAuth, 
  GoogleAuthProvider, 
  signInWithPopup, 
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { 
  getFirestore, 
  doc, 
  onSnapshot, 
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCP2_AgtMkaUBi9H2L85U8kagzUGSoDAFg",
  authDomain: "viola-kalendar.firebaseapp.com",
  projectId: "viola-kalendar",
  storageBucket: "viola-kalendar.firebasestorage.app",
  messagingSenderId: "313947429240",
  appId: "1:313947429240:web:0e65fc88f192f5f9f3d08d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

await setPersistence(auth, browserLocalPersistence).catch(console.error);

function notifyAuth(user) {
  window.__sichtovniceFirebase._user = user;
  if (window.__authListeners && window.__authListeners.length) {
    window.__authListeners.forEach(cb => {
      try { cb(user); } catch(e) { console.error(e); }
    });
  }
}

onAuthStateChanged(auth, (user) => {
  notifyAuth(user);
});

window.__realSubscribe = (onData, onStatus) => {
  try {
    const docRef = doc(db, "sichtovnice", "main");
    const unsub = onSnapshot(docRef, (snap) => {
      if (snap.exists()) {
        const data = snap.data();
        onData(data);
      } else {
        onData(null);
      }
      if (onStatus) onStatus("cloud");
    }, (err) => {
      console.error("Firestore onSnapshot error:", err);
      if (onStatus) onStatus("error");
    });
    return unsub;
  } catch (err) {
    console.error("Firestore subscribe setup error:", err);
    if (onStatus) onStatus("error");
    return () => {};
  }
};

window.__realSave = async (state) => {
  try {
    const docRefMain = doc(db, "sichtovnice", "main");
    const docRef2 = doc(db, "sichtovnice", "v2");
    await Promise.all([
      setDoc(docRefMain, state),
      setDoc(docRef2, state)
    ]);
    console.log("Firestore saved successfully");
    return true;
  } catch (err) {
    console.error("Firestore save error:", err);
    throw err;
  }
};

if (window.__pendingSubscribe) {
  window.__realSubscribe(window.__pendingSubscribe.onData, window.__pendingSubscribe.onStatus);
}

window.__sichtovniceLogin = async () => {
  const btn = [...document.querySelectorAll("button")].find(x => /PŘIHLÁSIT GOOGLE|OTEVÍRÁM/i.test(x.textContent));
  if (btn) {
    btn.disabled = true;
    btn.textContent = "OTEVÍRÁM GOOGLE…";
  }

  try {
    const result = await signInWithPopup(auth, provider);
    notifyAuth(result.user);
  } catch (err) {
    if (btn) {
      btn.disabled = false;
      btn.textContent = "PŘIHLÁSIT GOOGLE";
    }
  }
};
</script>

:root {
  --paper: #ece4d6;
  --sheet: #fffcf5;
  --ink: #26221d;
  --muted: #6e6657;
  --rule: #bdb09f;
  --rule-soft: #c8bcac;
  --shift: #f8e7d4;
  --shift-line: #d2a47c;
  --stamp: #1c5a3d;
  --stamp-soft: #d9e8de;
  --weekend: #e5e4ec;
  --weekend-ink: #3b3a50;
  --holiday: #f2dce3;
  --holiday-ink: #6b243e;
  --today: #cf9522;
  --today-bg: #fdf0d2;
  --accent: #6d4a2f;
}

body {
  background: var(--paper) !important;
  color: var(--ink) !important;
  font-family: "Archivo Narrow", system-ui, sans-serif !important;
  -webkit-font-smoothing: antialiased;
}

.sheet {
  background: var(--sheet);
  border: 2px solid #bdb09f;
  box-shadow: 0 1px 0 #fff inset, 0 18px 40px -28px rgb(38 34 29 / 0.45);
}

.cell-btn {
  transition: background-color 140ms cubic-bezier(0.25, 1, 0.5, 1),
    border-color 140ms cubic-bezier(0.25, 1, 0.5, 1),
    color 140ms cubic-bezier(0.25, 1, 0.5, 1);
}

input[type="time"] {
  font-family: "Courier Prime", ui-monospace, monospace;
}

.shift-cell {
  container-type: inline-size;
}

.led-panel {
  border-radius: 8px;
  background: #ffffff;
  border: 1px solid #d9cfc0;
  box-shadow: inset 0 -14px 20px -18px rgb(38 34 29 / 0.35);
}

.led-digits {
  font-family: "Oswald", "Archivo Narrow", system-ui, sans-serif;
  font-weight: 600;
  color: #1a1815;
  letter-spacing: -0.01em;
  line-height: 0.95;
  font-variant-numeric: tabular-nums;
}

.led-colon {
  color: #9a9184;
  padding-inline: 1px;
}

.led-rule {
  display: block;
  height: 1px;
  margin: 5px 0;
  background: linear-gradient(
    to right,
    rgb(38 34 29 / 0.14),
    rgb(38 34 29 / 0.06) 78%,
    transparent
  );
}

.led-edit { cursor: pointer; }
.led-edit:hover { background: rgb(38 34 29 / 0.07); }

.led-step {
  display: grid;
  place-items: center;
  width: 18px;
  height: 14px;
  border-radius: 3px;
  font-size: 7px;
  line-height: 1;
  color: #867d70;
  background: rgb(38 34 29 / 0.06);
}

.perforation {
  background-image: radial-gradient(
    circle at center,
    #cbbfab 0 1.9px,
    transparent 2.2px
  );
  background-size: 8px 12px;
  background-repeat: repeat-y;
  background-position: center top;
}

/* Tlačítka stavových ikonek v barevném kolečku */
.state-icons {
  display: flex !important;
  justify-content: center !important;
  align-items: center !important;
  gap: 8px !important;
  margin: 0 auto !important;
}

.state-icon {
  width: 32px !important;
  height: 32px !important;
  border-radius: 9999px !important;
  cursor: pointer !important;
}

.state-glyph { width: 17px !important; height: 17px !important; }

/* Střídání sloupců */
.col-even { background-color: #ffffff !important; }
.col-odd { background-color: #f1e7d8 !important; }

/* Víkendy a svátky */
.weekend-row, .weekend-row > div, .weekend-row .date-col, .weekend-row .break-row-cell {
  background-color: var(--weekend) !important;
}
.holiday-row, .holiday-row > div, .holiday-row .date-col, .holiday-row .break-row-cell {
  background-color: var(--holiday) !important;
}

.break-row-cell {
  display: flex !important;
  align-items: center !important;
  padding-left: 20px !important;
  min-height: 48px !important;
}

.break-row-label {
  font-family: "Oswald", "Archivo Narrow", sans-serif !important;
  font-size: 22px !important;
  font-weight: 700 !important;
  letter-spacing: 0.15em !important;
  position: sticky !important;
  left: 96px !important;
  z-index: 25 !important;
}

.day-row { border-bottom: 2px solid #bdb09f !important; }
.day-row > div:not(.date-col) { border-right: 2px solid #c8bcac !important; }

.name-head {
  font-family: "Oswald", "Archivo Narrow", sans-serif !important;
  font-size: 20px !important;
  font-weight: 600 !important;
  letter-spacing: 0.05em !important;
}

.day-num {
  font-family: "Oswald", "Archivo Narrow", sans-serif !important;
  font-size: 28px !important;
  font-weight: 600 !important;
  line-height: 1 !important;
  margin-bottom: 6px !important;
}

.day-name {
  font-family: "Oswald", "Archivo Narrow", sans-serif !important;
  font-size: 22px !important;
  font-weight: 600 !important;
  line-height: 1 !important;
  letter-spacing: 0.05em !important;
}

/* Razítko hodin rovné na 1 řádku */
.stamp {
  background: var(--stamp) !important;
  color: #f4f9f5 !important;
  font-family: "Oswald", "Archivo Narrow", sans-serif !important;
  font-weight: 600 !important;
  transform: none !important;
  box-shadow: 0 1px 0 rgb(28 90 61 / 0.35);
}

.shift-stamp {
  height: 38px !important;
  min-width: 44px !important;
  width: auto !important;
  padding: 0 6px !important;
  font-family: "Oswald", "Archivo Narrow", sans-serif !important;
  font-size: 26px !important;
  font-weight: 600 !important;
  transform: none !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 2px !important;
  white-space: nowrap !important;
}

.stamp-fraction {
  font-size: 17px !important;
  font-weight: 700 !important;
  line-height: 1 !important;
  vertical-align: baseline !important;
  margin-left: 1px !important;
}

.total-num, .total-sum {
  font-family: "Oswald", "Archivo Narrow", sans-serif !important;
  font-weight: 700 !important;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  line-height: 1;
}
.total-num { font-size: 30px !important; }
.total-sum { font-size: 22px !important; }
.total-unit { font-size: 14px !important; font-weight: 700 !important; }

/* Bílé oddělovací linky mezi jmény */
.sticky-people-header > div,
.sticky-people-header > button,
.sticky-people-header > .date-col {
  border-right: 2px solid #ffffff !important;

.sticky-people-header > div:last-child {
  border-right: none !important;
